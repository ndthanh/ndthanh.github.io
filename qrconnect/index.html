<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dummy File Upload</title>
</head>
<body>
  <h1>Dummy File Upload</h1>

  <input id="file-input" data-testid="file-input" type="file">

  <button id="upload-button" data-testid="upload-button" type="button">
    Upload
  </button>

  <p id="status" data-testid="upload-status">
    Chưa chọn file
  </p>

  <script>
    const fileInput = document.getElementById('file-input');
    const uploadButton = document.getElementById('upload-button');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', () => {
      status.textContent = fileInput.files.length
        ? `Đã chọn: ${fileInput.files[0].name}`
        : 'Chưa chọn file';
    });

    uploadButton.addEventListener('click', () => {
      if (!fileInput.files.length) {
        status.textContent = 'Vui lòng chọn file';
        return;
      }

      status.textContent =
        `Upload thành công: ${fileInput.files[0].name}`;

      status.dataset.state = 'success';
    });
  </script>
</body>
</html>
