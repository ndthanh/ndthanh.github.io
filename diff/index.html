<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Diff · Google Drive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#182338;font:15px system-ui,sans-serif}main{max-width:1160px;margin:40px auto;padding:0 20px}h1{margin-bottom:8px}p{color:#536179}.card{background:white;border:1px solid #dbe1ea;border-radius:12px;padding:20px;margin-top:20px}.settings,.editors{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600}input,textarea{width:100%;margin-top:8px;padding:12px;border:1px solid #c7d0de;border-radius:7px;font:inherit}textarea{min-height:300px;resize:vertical;font:14px/1.6 ui-monospace,monospace;tab-size:4}button{background:#2859d9;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}#status{white-space:pre-wrap}#diff{overflow:auto;max-height:650px;border:1px solid #dbe1ea;border-radius:6px}.row{display:grid;grid-template-columns:48px 48px 28px minmax(0,1fr);font:13px/1.7 ui-monospace,monospace;min-width:100%;width:max-content}.row span{padding:2px 8px}.number{color:#69778a;text-align:right;user-select:none;border-right:1px solid #0000000d}.content{white-space:pre;min-width:300px}.add{background:#e5f6e9;color:#145c2c}.remove{background:#ffebe9;color:#9b2926}.hint{font-size:13px}input:focus,textarea:focus{outline:2px solid #87a9ff;outline-offset:1px}@media(max-width:700px){.settings,.editors{grid-template-columns:1fr}main{margin:24px auto}textarea{min-height:200px}}
</style>
</head>
<body><main>
<h1>Text Diff</h1><p>So sánh hai phiên bản văn bản và lưu cùng một thư mục Google Drive.</p>
<form id="form">

<div class="card">
<div class="editors">
<label for="before">Bản gốc · before.txt<textarea id="before" maxlength="100000" spellcheck="false" placeholder="Dán văn bản gốc..."></textarea></label>
<label for="after">Bản mới · after.txt<textarea id="after" maxlength="100000" spellcheck="false" placeholder="Dán văn bản mới..."></textarea></label>
</div>
<p class="hint">Tối đa 100.000 ký tự và 2.000 dòng mỗi bên. So sánh theo dòng, giữ nguyên khoảng trắng; bỏ qua khác biệt kiểu xuống dòng CRLF/LF.</p>
<div class="actions"><button id="submit" type="submit">so sánh</button><span id="status" role="status" aria-live="polite"></span></div>
</div></form>
<section class="card" id="result" hidden><h2 id="summary"></h2><div id="diff" aria-label="Kết quả diff"></div></section>
<script>
const $ = id => document.getElementById(id);
// Configuration for this one-off project; not displayed in the UI.
const API_URL = 'https://script.google.com/macros/s/AKfycbz9lKlo6WEv7TWOMmSrBSUjzsoNrMRMcbAR_LcQ9jnUf8XAh0f8Fws_PPJ6FXHpU1F1CA/exec';
const ACCESS_TOKEN = '12345678';
$('form').addEventListener('submit', async event => {
  event.preventDefault();
  const endpoint = API_URL.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)) {
    $('status').textContent = 'URL backend chưa được cấu hình đúng.'; return;
  }
  if (['before','after'].some(id => $(id).value.replace(/\r\n?/g,'\n').split('\n').length > 2000)) {
    $('status').textContent = 'Mỗi bên tối đa 2.000 dòng.'; return;
  }
  $('submit').disabled = true;
  $('result').hidden = true;
  $('status').textContent = 'Đang so sánh và lưu vào Drive…';
  try {
    // URLSearchParams creates a simple form POST without a CORS preflight.
    // Do not set application/json or use mode: no-cors (response would be unreadable).
    const response = await fetch(endpoint, {
      method: 'POST', redirect: 'follow', credentials: 'omit',
      body: new URLSearchParams({ token: ACCESS_TOKEN, before: $('before').value, after: $('after').value })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || 'Backend trả về lỗi.');
    $('summary').textContent = data.added || data.removed ? `+${data.added} dòng thêm · −${data.removed} dòng xóa` : 'Hai nội dung giống nhau';
    const fragment = document.createDocumentFragment();
    for (const row of data.rows) {
      const line = document.createElement('div'); line.className = 'row ' + row.type;
      for (const [value, cls] of [[row.left, 'number'], [row.right, 'number'], [row.type === 'add' ? '+' : row.type === 'remove' ? '−' : ' ', 'sign'], [row.text, 'content']]) {
        const cell = document.createElement('span'); cell.className = cls; cell.textContent = value == null ? '' : String(value); line.append(cell);
      }
      fragment.append(line);
    }
    $('diff').replaceChildren(fragment); $('result').hidden = false;
    $('status').textContent = 'Đã lưu 2 file và hoàn tất so sánh.';
  } catch (error) {
    $('status').textContent = 'Lỗi: ' + error.message + '\nNếu lỗi mạng/CORS: kiểm tra deployment cho phép Anyone, dùng URL /exec và đã cấp quyền Drive. File có thể đã được lưu nếu phản hồi bị mất; kiểm tra Drive trước khi thử lại.';
  } finally { $('submit').disabled = false; }
});
</script></main></body></html>
